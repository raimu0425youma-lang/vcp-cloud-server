<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 340px; font-family: system-ui, sans-serif; padding: 16px; margin: 0; background: #0f172a; color: #f8fafc; }
    .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
    h3 { margin: 0; color: #38bdf8; font-size: 16px; }
    .savings { background: #1e293b; border: 1px solid #334155; padding: 8px 12px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-size: 12px; }
    .savings-val { color: #10b981; font-weight: bold; font-size: 14px; }
    textarea { width: 100%; height: 70px; background: #1e293b; border: 1px solid #475569; color: white; border-radius: 8px; padding: 8px; box-sizing: border-box; font-size: 13px; resize: none; margin-bottom: 10px; }
    textarea:focus { outline: none; border-color: #38bdf8; }
    button { width: 100%; padding: 10px; background: #0284c7; border: none; color: white; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #0369a1; }
    .badge-route { display: inline-block; margin-top: 10px; padding: 4px 8px; background: #065f46; color: #34d399; font-size: 11px; border-radius: 6px; font-weight: bold; }
    #result { margin-top: 8px; font-size: 12px; background: #1e293b; padding: 10px; border-radius: 8px; word-break: break-all; min-height: 60px; line-height: 1.5; color: #cbd5e1; }
  </style>
</head>
<body>
  <div class="header">
    <h3>🛡️ AEG Smart Router</h3>
    <span style="font-size: 10px; background: #0284c7; padding: 2px 6px; border-radius: 4px;">v1.1</span>
  </div>

  <div class="savings">
    <span>💡 推定節約額</span>
    <span class="savings-val" id="savingsVal">$0.00</span>
  </div>

  <textarea id="promptInput" placeholder="AIへの質問を入力... (例: コードを書いて、英語に翻訳して)"></textarea>
  <button id="sendBtn">送信 & 自動最適化ルーティング</button>

  <div id="routeBadge" class="badge-route" style="display: none;"></div>
  <div id="result">ここにAIからの回答が表示されます</div>

  <script src="popup.js"></script>
</body>
</html>
