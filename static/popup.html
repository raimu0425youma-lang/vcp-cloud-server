<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>VCP Enterprise Control Center</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg-color: #0b0f19; --card-bg: #131b2e; --border-color: #1e293b; --accent-color: #2563eb; --accent-hover: #1d4ed8; --text-main: #f8fafc; --text-muted: #94a3b8; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 24px; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; border-bottom: 1px solid var(--border-color); padding-bottom: 16px; }
        h1 { font-size: 20px; font-weight: 600; }
        .status-badge { background: #065f46; color: #34d399; padding: 4px 12px; font-size: 12px; border-radius: 4px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 20px; }
        .card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 20px; }
        .card h2 { font-size: 14px; color: var(--text-muted); margin-bottom: 16px; }
        .form-group { margin-bottom: 12px; }
        label { display: block; font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
        input, textarea { width: 100%; background: #0f172a; border: 1px solid var(--border-color); color: var(--text-main); padding: 8px 12px; border-radius: 4px; }
        button { width: 100%; background-color: var(--accent-color); color: white; border: none; padding: 10px; border-radius: 4px; font-weight: 600; cursor: pointer; margin-top: 8px; }
        button:hover { background-color: var(--accent-hover); }
        .log-box { background: #0f172a; border: 1px solid var(--border-color); padding: 10px; border-radius: 4px; font-family: monospace; font-size: 12px; color: #38bdf8; margin-top: 10px; min-height: 40px; }
        .chart-container { position: relative; height: 200px; width: 100%; }
    </style>
</head>
<body>
    <header>
        <h1>VCP ENTERPRISE CONTROL CENTER</h1>
        <div class="status-badge" id="sys-status">SYSTEM ACTIVE</div>
    </header>
    <div class="grid">
        <div class="card">
            <h2>Financial Compound Simulator</h2>
            <div class="form-group"><label>Initial Capital</label><input type="number" id="sim-initial" value="100"></div>
            <div class="form-group"><label>Growth Rate (%)</label><input type="number" id="sim-rate" value="5"></div>
            <div class="form-group"><label>Period (Years)</label><input type="number" id="sim-years" value="15"></div>
            <button onclick="runSimulation()">Execute Simulation</button>
            <div class="log-box" id="sim-result">Result: Awaiting execution</div>
        </div>
        <div class="card">
            <h2>Core Neural Processor</h2>
            <div class="form-group"><label>Query Input</label><textarea id="ai-prompt" rows="3" placeholder="Enter processing query..."></textarea></div>
            <button onclick="runAI()">Process Query</button>
            <div class="log-box" id="ai-result">Output: Idle</div>
        </div>
        <div class="card">
            <h2>Realtime Analytics & Chart</h2>
            <div class="chart-container">
                <canvas id="analyticsChart"></canvas>
            </div>
            <button onclick="updateChartData()">Sync & Render Data</button>
        </div>
    </div>
    <script>
        let myChart;
        window.onload = () => { initChart(); };
        function initChart() {
            const ctx = document.getElementById("analyticsChart").getContext("2d");
            myChart = new Chart(ctx, {
                type: "doughnut",
                data: { labels: ["Sales", "Development", "Operations"], datasets: [{ data: [55, 25, 20], backgroundColor: ["#2563eb", "#38bdf8", "#1e293b"] }] },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }
        function updateChartData() {
            myChart.data.datasets[0].data = [Math.floor(Math.random()*50)+30, Math.floor(Math.random()*30)+10, Math.floor(Math.random()*20)+10];
            myChart.update();
        }
        function runSimulation() {
            const init = parseFloat(document.getElementById("sim-initial").value);
            const rate = parseFloat(document.getElementById("sim-rate").value) / 100;
            const years = parseInt(document.getElementById("sim-years").value);
            document.getElementById("sim-result").innerText = "Calculated Future Value: " + (init * Math.pow((1 + rate), years)).toFixed(2);
        }
        async function runAI() {
            const prompt = document.getElementById("ai-prompt").value;
            const resBox = document.getElementById("ai-result");
            resBox.innerText = "Processing...";
            try {
                const response = await fetch("/api/ai/process", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ prompt }) });
                const data = await response.json();
                resBox.innerText = data.result || "Execution completed.";
            } catch { resBox.innerText = "Processed: " + prompt; }
        }
    </script>
</body>
</html>
