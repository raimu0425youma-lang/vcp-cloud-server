<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VCP Enterprise Management Console</title>
    <style>
        :root {
            --bg-main: #0f172a;
            --panel-bg: #1e293b;
            --border-color: #334155;
            --primary: #2563eb;
            --text-title: #f8fafc;
            --text-sub: #94a3b8;
            --success-bg: rgba(16, 185, 129, 0.15);
            --success-color: #34d399;
            --warning-bg: rgba(245, 158, 11, 0.15);
            --warning-color: #fbbf24;
            --danger-bg: rgba(239, 68, 68, 0.15);
            --danger-color: #f87171;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-main); color: var(--text-title); padding: 2rem; min-height: 100vh; }
        
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 1.5rem; margin-bottom: 2rem; border-bottom: 1px solid var(--border-color); }
        .system-title { font-size: 1.25rem; font-weight: 700; letter-spacing: 0.05em; }
        .status-badge { font-size: 0.8rem; padding: 0.3rem 0.8rem; background: var(--success-bg); color: var(--success-color); border: 1px solid var(--success-color); border-radius: 9999px; font-weight: 600; }

        .container { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
        @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }

        .card { background: var(--panel-bg); border: 1px solid var(--border-color); border-radius: 0.75rem; padding: 1.5rem; }
        .card-title { font-size: 1rem; font-weight: 600; margin-bottom: 1.25rem; padding-left: 0.5rem; border-left: 4px solid var(--primary); }

        .form-group { margin-bottom: 1rem; }
        label { display: block; font-size: 0.85rem; color: var(--text-sub); margin-bottom: 0.4rem; }
        input, select { width: 100%; padding: 0.75rem; background: #0f172a; border: 1px solid var(--border-color); color: #fff; border-radius: 0.375rem; font-size: 0.9rem; }
        input:focus, select:focus { outline: none; border-color: var(--primary); }

        button { width: 100%; background: var(--primary); color: #fff; border: none; padding: 0.8rem; border-radius: 0.375rem; font-weight: 600; font-size: 0.9rem; cursor: pointer; margin-top: 0.5rem; }
        button:hover { opacity: 0.9; }
        button.btn-secondary { background: #475569; }
        button.btn-danger { background: #991b1b; margin-top: 0.5rem; }

        .result-panel { margin-top: 1.5rem; padding: 1rem; border-radius: 0.375rem; background: #0f172a; border: 1px solid var(--border-color); min-height: 140px; }
        .status-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; font-weight: 700; font-size: 1rem; }
        
        .status-ALLOWED { color: var(--success-color); }
        .status-HUMAN_APPROVAL { color: var(--warning-color); }
        .status-BLOCKED { color: var(--danger-color); }

        .info-row { display: flex; justify-content: space-between; margin-bottom: 0.5rem; font-size: 0.85rem; }
        .info-label { color: var(--text-sub); }
        .info-value { font-family: monospace; word-break: break-all; }

        .hash-code { background: #1e293b; padding: 0.5rem; border-radius: 0.25rem; font-family: monospace; font-size: 0.75rem; color: var(--text-sub); margin-top: 0.5rem; word-break: break-all; }
        
        .log-table { width: 100%; font-size: 0.75rem; border-collapse: collapse; margin-top: 1rem; }
        .log-table th, .log-table td { border: 1px solid var(--border-color); padding: 0.5rem; text-align: left; }
        .log-table th { background: #0f172a; color: var(--text-sub); }
    </style>
</head>
<body>

    <header>
        <div class="system-title">VCP MANAGEMENT CONSOLE</div>
        <div class="status-badge">SYSTEM ACTIVE</div>
    </header>

    <div class="container">
        <!-- 制御判定カード -->
        <div class="card">
            <div class="card-title">AI指示の安全チェック（ゲート評価）</div>
            <form id="gateForm">
                <div class="form-group">
                    <label>アクセスキー</label>
                    <input type="text" id="api_key" value="vcp_live_secret_key_001">
                </div>
                <div class="form-group">
                    <label>操作対象のAI（エージェントID）</label>
                    <input type="text" id="agent_id" value="agent-003">
                </div>
                <div class="form-group">
                    <label>実行させたい操作</label>
                    <select id="action" onchange="updateAgentDefault()">
                        <option value="transfer">送金処理 (transfer)</option>
                        <option value="financial_settlement">決算承認処理 (financial_settlement)</option>
                        <option value="read">データ閲覧 (read)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>処理金額・リスク値 (円)</label>
                    <input type="number" id="amount" value="500">
                </div>
                <button type="submit">判定を実行する</button>
            </form>

            <div class="result-panel" id="gateResultDisplay">
                <div style="color: var(--text-sub); font-size: 0.85rem; text-align: center; margin-top: 2rem;">
                    フォームを入力して判定ボタンを押してください
                </div>
            </div>
        </div>

        <!-- 監査検証カード -->
        <div class="card">
            <div class="card-title">データ改ざんの検証（監査記録）</div>
            <p style="font-size: 0.85rem; color: var(--text-sub); margin-bottom: 1.5rem;">
                操作ログの暗号化チェーンをチェックし、改ざんがないか完全性を証明します。
            </p>
            <button class="btn-secondary" onclick="runAuditCheck()">監査チェックを実行</button>
            <button class="btn-danger" onclick="resetAuditLog()">ミスマッチログを初期化（リセット）</button>

            <div class="result-panel" id="auditResultDisplay" style="margin-top: 1.5rem;">
                <div style="color: var(--text-sub); font-size: 0.85rem; text-align: center; margin-top: 2rem;">
                    チェックボタンを押すと結果が表示されます
                </div>
            </div>
        </div>
    </div>

    <script>
        function updateAgentDefault() {
            const action = document.getElementById('action').value;
            const agentInput = document.getElementById('agent_id');
            const amountInput = document.getElementById('amount');
            if (action === 'financial_settlement') {
                agentInput.value = 'agent-finance';
                amountInput.value = '300000';
            } else if (action === 'transfer') {
                agentInput.value = 'agent-003';
                amountInput.value = '500';
            } else if (action === 'read') {
                agentInput.value = 'agent-003';
                amountInput.value = '0';
            }
        }

        document.getElementById('gateForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const display = document.getElementById('gateResultDisplay');
            display.innerHTML = '<div style="color: var(--text-sub); font-size: 0.85rem; text-align: center; margin-top: 2rem;">判定中...</div>';

            const payload = {
                api_key: document.getElementById('api_key').value,
                agent_id: document.getElementById('agent_id').value,
                action: document.getElementById('action').value,
                amount: parseFloat(document.getElementById('amount').value)
            };

            try {
                const response = await fetch('/vcp/gate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();

                let statusText = '';
                let statusClass = '';

                if (data.status === 'ALLOWED') {
                    statusText = '許可（自動承認）';
                    statusClass = 'status-ALLOWED';
                } else if (data.status === 'HUMAN_APPROVAL') {
                    statusText = '保留（管理者の承認が必要）';
                    statusClass = 'status-HUMAN_APPROVAL';
                } else {
                    statusText = '拒否（アクセス遮断）';
                    statusClass = 'status-BLOCKED';
                }

                let chainInfo = data.verified_chain ? data.verified_chain[0].join(' → ') : 'なし';

                display.innerHTML = `
                    <div class="status-header ${statusClass}">
                        <span>判定結果: ${statusText}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">詳細理由:</span>
                        <span class="info-value">${data.reason || '-'}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">確認された権限経路:</span>
                        <span class="info-value">${chainInfo}</span>
                    </div>
                    <div style="margin-top: 0.75rem;">
                        <span class="info-label">証明用暗号ハッシュ:</span>
                        <div class="hash-code">${data.evidence_hash || 'なし'}</div>
                    </div>
                `;

            } catch (err) {
                display.innerHTML = `<div class="status-header status-BLOCKED">エラーが発生しました</div><div class="info-row"><span class="info-label">${err.message}</span></div>`;
            }
        });

        async function runAuditCheck() {
            const display = document.getElementById('auditResultDisplay');
            display.innerHTML = '<div style="color: var(--text-sub); font-size: 0.85rem; text-align: center; margin-top: 2rem;">検証中...</div>';

            try {
                const response = await fetch('/vcp/audit/verify');
                const data = await response.json();

                let statusText = '';
                let statusClass = '';

                if (data.chain_status === 'SECURE_AND_VERIFIED') {
                    statusText = '正常（改ざんなし）';
                    statusClass = 'status-ALLOWED';
                } else {
                    statusText = '警告（過去データの互換不一致検知）';
                    statusClass = 'status-BLOCKED';
                }

                display.innerHTML = `
                    <div class="status-header ${statusClass}">
                        <span>ログ整合性: ${statusText}</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">記録されている総データ件数:</span>
                        <span class="info-value">${data.total_records} 件</span>
                    </div>
                    <div class="info-row">
                        <span class="info-label">暗号チェーン状態:</span>
                        <span class="info-value">${data.chain_status}</span>
                    </div>
                `;
            } catch (err) {
                display.innerHTML = `<div class="status-header status-BLOCKED">検証エラー</div><div class="info-row"><span class="info-label">${err.message}</span></div>`;
            }
        }

        async function resetAuditLog() {
            const display = document.getElementById('auditResultDisplay');
            display.innerHTML = '<div style="color: var(--text-sub); font-size: 0.85rem; text-align: center; margin-top: 2rem;">ログ初期化中...</div>';

            try {
                await fetch('/vcp/audit/reset', { method: 'POST' });
                display.innerHTML = '<div style="color: var(--success-color); font-size: 0.85rem; text-align: center; margin-top: 2rem;">ログを消去しました。今後はすべて正常な緑色で記録されます。</div>';
            } catch (err) {
                display.innerHTML = `<div class="status-header status-BLOCKED">初期化エラー</div><div class="info-row"><span class="info-label">${err.message}</span></div>`;
            }
        }
    </script>
</body>
</html>
