<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>VCP エンタープライズ制御センター</title>
    <style>
        :root { --bg-color: #0b0f19; --card-bg: #111827; --accent: #3b82f6; --text: #f3f4f6; }
        body { background-color: var(--bg-color); color: var(--text); padding: 2rem; font-family: sans-serif; }
        .card { background: var(--card-bg); padding: 2rem; border-radius: 1rem; border: 1px solid #374151; }
        h1 { margin-bottom: 1.5rem; font-size: 1.5rem; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; color: #9ca3af; }
        input, select { width: 100%; padding: 0.5rem; background: #030712; border: 1px solid #374151; color: white; }
        button { width: 100%; padding: 0.75rem; background: var(--accent); color: white; border: none; cursor: pointer; margin-top: 1rem; }
        #vcpResult { margin-top: 1rem; padding: 1rem; background: #000; border: 1px solid #4b5563; }
    </style>
</head>
<body>
    <div class="card">
        <h1>VCP エンタープライズ制御センター</h1>
        <div class="form-group">
            <label>エージェントID</label>
            <input type="text" id="agent_id" value="agent-001">
        </div>
        <div class="form-group">
            <label>実行アクション</label>
            <select id="action">
                <option value="transfer">送金 (Financial)</option>
                <option value="read">データ読み取り (Read)</option>
                <option value="delete_files">ファイル削除 (High Risk)</option>
            </select>
        </div>
        <div class="form-group">
            <label>金額 / リスク値</label>
            <input type="number" id="amount" value="500">
        </div>
        <button onclick="dispatch()">VCPコアへ送信</button>
        <div id="vcpResult">判定待ち...</div>
    </div>
    <script>
        async function dispatch() {
            const payload = {
                agent_id: document.getElementById('agent_id').value,
                action: document.getElementById('action').value,
                amount: parseFloat(document.getElementById('amount').value)
            };
            const res = await fetch('/vcp/gate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            document.getElementById('vcpResult').innerText = JSON.stringify(data, null, 2);
        }
    </script>
</body>
</html>
